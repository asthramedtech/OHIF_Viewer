version: 1

frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - yarn install --frozen-lockfile

    build:
      commands:
        - yarn run build

  artifacts:
    baseDirectory: platform/app/dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
      - .yarn/cache/**/*

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install -g pnpm@11.5.2
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: platform/app/dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
